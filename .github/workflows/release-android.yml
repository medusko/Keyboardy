name: Release Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Android Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Determine Version & Tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
            TAG="android-v${VER}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#android-v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK & Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk "Keyboardy-Android-v${{ steps.meta.outputs.version }}.apk"

      - name: Extract Changelog from CHANGELOG.md
        id: changelog
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ -f "CHANGELOG.md" ]] && grep -q "## \[$TAG\]" CHANGELOG.md; then
            awk "/## \[$TAG\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            cat > release_notes.md << EOF
          ## 📱 Keyboardy for Android v${{ steps.meta.outputs.version }}
          Zero-step auxiliary Google Image & GIF keyboard for Android.
          EOF
          fi

      - name: Create GitHub Release (Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Keyboardy for Android v${{ steps.meta.outputs.version }}"
          body_path: release_notes.md
          files: |
            Keyboardy-Android-v${{ steps.meta.outputs.version }}.apk
