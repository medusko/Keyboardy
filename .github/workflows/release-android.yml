name: Release Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Android Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Determine Version & Tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
            TAG="android-v${VER}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#android-v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib

          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          ks_path = ws / "release.keystore"
          ks_path.write_bytes(base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())))

          def esc(val: str) -> str:
              return val.replace("\\", "\\\\")

          props = "\n".join([
              f"storeFile={esc(str(ks_path))}",
              f"storePassword={esc(os.environ['KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['KEY_PASSWORD'])}",
              "",
          ])
          (ws / "keystore.properties").write_text(props, encoding="utf-8")
          PY

      - name: Build Android Release APK & Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease testReleaseUnitTest
          cp app/build/outputs/apk/release/app-release.apk "Keyboardy-Android-v${{ steps.meta.outputs.version }}.apk"

      - name: Clean Up Release Signing Material
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" "${{ github.workspace }}/keystore.properties"

      - name: Extract Changelog from CHANGELOG.md
        id: changelog
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ -f "CHANGELOG.md" ]] && grep -q "## \[$TAG\]" CHANGELOG.md; then
            awk "/## \[$TAG\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            cat > release_notes.md << EOF
          ## 📱 Keyboardy for Android v${{ steps.meta.outputs.version }}
          Zero-step auxiliary Google Image & GIF keyboard for Android.
          EOF
          fi

      - name: Create GitHub Release (Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Keyboardy for Android v${{ steps.meta.outputs.version }}"
          body_path: release_notes.md
          files: |
            Keyboardy-Android-v${{ steps.meta.outputs.version }}.apk
